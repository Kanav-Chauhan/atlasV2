name: atlasv2

x-api-env: &api-env
  ATLAS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  ATLAS_REDIS_URL: redis://redis:6379/0
  ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-http://ai-gateway:4000/v1}
  ATLAS_LLM_API_KEY: ${ATLAS_LLM_API_KEY:-}

x-api-volumes: &api-volumes
  - ../demo_corpus:/corpus:ro
  - atlasv2_files:/data/files
  - atlasv2_models:/models

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - atlasv2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    image: atlasv2-api
    restart: unless-stopped
    mem_limit: 1536m  # embedder + reranker (Phase 4) + LangGraph/LangChain + light LLM Guard (Phase 5)
    command: sh -c "alembic upgrade head && exec uvicorn atlas_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *api-env
      # Super admin login: only the api needs these (not the worker).
      ATLAS_SUPERADMIN_EMAIL: ${ATLAS_SUPERADMIN_EMAIL:-}
      ATLAS_SUPERADMIN_PASSWORD_HASH: ${ATLAS_SUPERADMIN_PASSWORD_HASH:-}
      ATLAS_SESSION_SECRET: ${ATLAS_SESSION_SECRET:-}
      # LangSmith tracing (Phase 6): off unless LANGSMITH_TRACING=true AND a key is set.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-atlas-v2}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      RAGAS_DO_NOT_TRACK: "true"  # the answer eval runs in this image; no usage stats sent
    volumes: *api-volumes
    ports:
      - "127.0.0.1:8111:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [default, ai-gateway]

  worker:
    image: atlasv2-api
    restart: unless-stopped
    mem_limit: 3g
    command: celery -A atlas_api.worker worker --concurrency 1 --max-tasks-per-child 20 --loglevel info
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [default, ai-gateway]

  web:
    build:
      context: ../apps/web
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    mem_limit: 384m
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3011:3000"
    depends_on: [api]

volumes:
  atlasv2_pgdata:
    name: atlasv2_pgdata
  atlasv2_files:
    name: atlasv2_files
  atlasv2_models:
    name: atlasv2_models

networks:
  ai-gateway:
    external: true
