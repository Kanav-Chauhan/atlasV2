name: atlasv2

x-api-env: &api-env
  ATLAS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  ATLAS_REDIS_URL: redis://redis:6379/0
  ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-http://ai-gateway:4000/v1}
  ATLAS_LLM_API_KEY: ${ATLAS_LLM_API_KEY:-}

x-api-volumes: &api-volumes
  - ../demo_corpus:/corpus:ro
  - atlasv2_files:/data/files
  - atlasv2_models:/models

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - atlasv2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    image: atlasv2-api
    restart: unless-stopped
    mem_limit: 1536m  # embedder + reranker (Phase 4) + LangGraph/LangChain + light LLM Guard (Phase 5)
    command: sh -c "alembic upgrade head && exec uvicorn atlas_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *api-env
      # Super admin login: only the api needs these (not the worker).
      ATLAS_SUPERADMIN_EMAIL: ${ATLAS_SUPERADMIN_EMAIL:-}
      # Clerk (Phase 10): waitlist, invitations, linking sign-ins (secret key); session-JWT
      # issuer + JWKS come from the publishable key. Production instance (clerk.kanav.space).
      ATLAS_CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ATLAS_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      ATLAS_METRICS_PORT: "9464"  # Prometheus (metrics.py), internal network only
      ATLAS_SUPERADMIN_PASSWORD_HASH: ${ATLAS_SUPERADMIN_PASSWORD_HASH:-}
      ATLAS_SESSION_SECRET: ${ATLAS_SESSION_SECRET:-}
      # LangSmith tracing (Phase 6): off unless LANGSMITH_TRACING=true AND a key is set.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-atlas-v2}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}  # needed by org-scoped service keys
      RAGAS_DO_NOT_TRACK: "true"  # the answer eval runs in this image; no usage stats sent
    volumes: *api-volumes
    ports:
      - "127.0.0.1:8111:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [default, ai-gateway]

  worker:
    image: atlasv2-api
    restart: unless-stopped
    mem_limit: 3g
    # --beat: the nightly demo reset (worker.py beat_schedule); only ever run ONE worker with it.
    command: celery -A atlas_api.worker worker --beat --schedule /tmp/celerybeat-schedule --concurrency 1 --max-tasks-per-child 20 --loglevel info
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [default, ai-gateway]

  web:
    build:
      context: ../apps/web
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      API_URL: http://api:8000
      # Clerk middleware (session refresh on /app, /sign-in, /sign-up, /onboarding).
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # Product analytics (/analytics.js → PostHog capture API); empty key = off.
      POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "127.0.0.1:3011:3000"
    depends_on: [api]

  # ---- Monitoring (Phase 11): Prometheus scrapes the api + the host, Grafana at /grafana ----
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - atlasv2_prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command: [--path.rootfs=/rootfs, --path.procfs=/host/proc, --path.sysfs=/host/sys]
    volumes:
      - /:/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    mem_limit: 384m  # 256m was too tight: restarts while loading the dashboard
    environment:
      GF_SERVER_ROOT_URL: https://p10.kanav.space/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - atlasv2_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3012:3000"
    depends_on: [prometheus]

volumes:
  atlasv2_prometheus:
  atlasv2_grafana:
  atlasv2_pgdata:
    name: atlasv2_pgdata
  atlasv2_files:
    name: atlasv2_files
  atlasv2_models:
    name: atlasv2_models

networks:
  ai-gateway:
    external: true
