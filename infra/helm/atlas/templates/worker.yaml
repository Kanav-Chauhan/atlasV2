apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: 1  # it runs Celery beat too: two would reset the demo twice
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "atlas.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "atlas.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: worker
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["celery", "-A", "atlas_api.worker", "worker", "--beat",
                    "--schedule", "/tmp/celerybeat-schedule", "--concurrency", "1",
                    "--max-tasks-per-child", "20", "--loglevel", "info"]
          {{- include "atlas.appEnv" . | nindent 10 }}
          volumeMounts: {{- include "atlas.appMounts" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes: {{- include "atlas.appVolumes" . | nindent 8 }}
