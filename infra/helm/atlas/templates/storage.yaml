{{- range $name, $s := .Values.storage }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "atlas.labels" $ | nindent 4 }}
spec:
  accessModes: [{{ $s.accessMode }}]
  {{- with $s.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ $s.size }} } }
---
{{- end }}
