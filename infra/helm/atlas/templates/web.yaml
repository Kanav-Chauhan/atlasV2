apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "atlas.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "atlas.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: API_URL, value: "http://{{ .Values.api.serviceName }}:8000" }
            - { name: POSTHOG_KEY, value: {{ .Values.config.POSTHOG_KEY | quote }} }
            - { name: POSTHOG_HOST, value: {{ .Values.config.POSTHOG_HOST | quote }} }
            - { name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, value: {{ .Values.config.ATLAS_CLERK_PUBLISHABLE_KEY | quote }} }
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: ATLAS_CLERK_SECRET_KEY
                  optional: true
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector: {{- include "atlas.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: http }]
