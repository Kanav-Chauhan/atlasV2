apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "atlas.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "atlas.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      initContainers:
        - name: migrate  # alembic is idempotent; with several replicas each runs it once
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- include "atlas.appEnv" . | nindent 10 }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["uvicorn", "atlas_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: 9464 }
          {{- include "atlas.appEnv" . | nindent 10 }}
          volumeMounts: {{- include "atlas.appMounts" . | nindent 12 }}
          startupProbe:  # first start loads the embedder + reranker
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes: {{- include "atlas.appVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.serviceName }}
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector: {{- include "atlas.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
