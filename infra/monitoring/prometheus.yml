# Atlas v2 monitoring (Phase 11). Prometheus scrapes every 15 s; Grafana draws it at /grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: atlas-api  # metrics.py on its own port, not reachable from outside
    static_configs: [{ targets: ["api:9464"] }]
  - job_name: node  # the VPS: CPU, memory, disk, network
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
