# Shown in Grafana (Alerting → Alert rules, "Prometheus" data source) and Prometheus /alerts.
# No notifications are sent yet: there is no Alertmanager / contact point (owner decision).
groups:
  - name: atlas
    rules:
      - alert: AtlasApiDown
        expr: up{job="atlas-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "The Atlas API is not answering (2 minutes)." }
      - alert: AtlasServerErrors
        expr: sum(rate(atlas_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(atlas_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of API requests fail (5xx) over 5 minutes." }
      - alert: AtlasSlowAnswers
        expr: histogram_quantile(0.95, sum by (le) (rate(atlas_answer_duration_seconds_bucket[15m]))) > 20
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "95% of answers take longer than 20 s." }
      - alert: DiskAlmostFull
        expr: 1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} > 0.9
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "The server disk is over 90% full (prune Docker images)." }
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Less than 8% of server memory is free." }
