name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas
      ATLAS_REDIS_URL: redis://localhost:6379/0
      ATLAS_MODELS_DIR: ${{ github.workspace }}/.models
      ATLAS_FILES_DIR: /tmp/atlas-files
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-bge-small-en-v1.5-jina-reranker-v1-turbo-en
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest --ignore=tests/test_eval_smoke.py
      # Retrieval eval gate (smoke): tiny fixture org, real ingest + hybrid_rerank, no corpus and
      # no LLM. Fails on Hit@5 < 1.0 or any permission leak. The full evals are manual/nightly:
      # docs/RAG_GUIDE.md step 9.
      - name: Retrieval eval gate (smoke)
        run: uv run pytest tests/test_eval_smoke.py -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Builds both images, then installs the Helm chart on a throwaway kind cluster and waits
  # until api (migrations + models), worker, web, Postgres and Redis are all ready.
  images-and-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t atlasv2-api:ci apps/api
      - run: docker build -t atlasv2-web:ci --build-arg API_URL=http://api:8000 apps/web
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: helm lint infra/helm/atlas
      - uses: helm/kind-action@v1
        with:
          cluster_name: atlas
      - run: kind load docker-image atlasv2-api:ci atlasv2-web:ci --name atlas
      - name: helm install
        run: >-
          helm install demo infra/helm/atlas --wait --timeout 15m
          --set images.api.repository=atlasv2-api --set images.api.tag=ci
          --set images.web.repository=atlasv2-web --set images.web.tag=ci
          --set ingress.enabled=false
          --set secrets.ATLAS_SESSION_SECRET=ci-only-secret-not-used-for-anything-real
      - name: health from inside the cluster
        run: |
          kubectl get pods -o wide
          kubectl run probe --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
            sh -c 'curl -fsS http://api:8000/health/ready && curl -fsS -o /dev/null -w "web %{http_code}\n" http://demo-web:3000/login'
      - name: logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide; kubectl describe pods | tail -n 80
          for c in api worker web; do kubectl logs deploy/demo-$c --all-containers --tail=60 || true; done
