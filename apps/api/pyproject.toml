[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas v2 API"
authors = [
    { name = "Kanav Chauhan", email = "kanavchauhan08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.7.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-redis>=0.3.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-fastembed>=0.8.0",
    "llama-index-node-parser-docling>=0.6.0",
    "llama-index-readers-docling>=0.6.0",
    "llama-index-vector-stores-postgres>=0.10.0",
    "llm-guard>=0.3.16",
    "psycopg-pool>=3.3.3",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "redisvl>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.40",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "llm_guard.*", "redisvl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pulled in through redisvl/langchain; mypy 2.4 crashes writing its cache.
module = ["transformers.*", "torch.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["atlas_api.worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Postgres and Redis"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
